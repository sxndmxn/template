services:
  server:
    build:
      context: ./server/Server.Api
      dockerfile: Dockerfile
    container_name: template-server
    ports:
      - "5294:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: template-client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://server:8080
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
